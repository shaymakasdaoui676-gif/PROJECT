<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="controle.js"></script>
</head>
<body>
    <form action="" onsubmit="return verif()">
        <fieldset>
            <h1>Inscription au club </h1>
            <div>Nom complet :</div>
            <div><input type="text" name="" id="nom" placeholder="saisir le nom complet"></div>
            <div>Email:</div>
            <div><input type="email" name="" id="mail" placeholder="saisir l'email"></div>
            <div>Mot de passe:</div>
            <div><input type="password" name="" id="mdp" placeholder="saisir le mot de passe"></div>
            <div>Confirmer le mot de passe:</div>
            <div><input type="password" name="" id="cmdp" placeholder="confirmer le mot de passe"></div>
            <input type="submit" value="s'incrire" class="btn"> <div class="message" id="message">Message d'erreur / succés(div#message)</div>
            <div><input type="text" name="" id="err"></div>
           
        </fieldset>
    </form>
    
</body>
</html>
